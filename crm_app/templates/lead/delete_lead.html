{% extends 'base.html' %}

{% block title %}Delete Lead - CRM System{% endblock %}

{% block content %}

<div class="flex-center" style="min-height: 50vh;">
    <div class="card confirm-card text-center" style="max-width: 480px; width: 100%;">
        <div class="card-body">

            <div class="confirm-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <h3>Delete Lead?</h3>
            <p class="text-muted mb-2">
                Are you sure you want to delete the lead for
                <strong style="color: var(--text-primary);">{{ lead.customer }}</strong>?
                <br>This action cannot be undone.
            </p>

            <form method="POST" id="deleteLeadForm">
                {% csrf_token %}

                <div class="confirm-type-box">
                    <label for="confirmLead">Type <strong>{{ lead.customer }}</strong> to confirm</label>
                    <input type="text" id="confirmLead" autocomplete="off" placeholder="{{ lead.customer }}">
                </div>

                <div class="flex-center gap-3">
                    <button type="submit" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                    <a href="{% url 'lead-list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    initDeleteConfirm("confirmLead", "confirmDeleteBtn", "{{ lead.customer|escapejs }}");
</script>
{% endblock %}
